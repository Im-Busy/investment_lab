[project]
name = "investment-trying"
version = "0.1.0"
description = "Trading Pattern Detection System"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # Core Data Science
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "statsmodels>=0.14.6",
    "numba>=0.59.0",  # JIT compilation for Phase 2 performance optimization
    # Machine Learning
    "scikit-learn>=1.4.0",
    "catboost>=1.2.8",
    "chronos-forecasting>=2.0.0",
    # Backtesting & Trading
    "backtesting>=0.6.5",
    "vectorbt>=0.25.0",  # Portfolio-level vectorized backtesting (Phase 3)
    "yfinance>=1.2.0",
    "pandas-ta>=0.3.14b0",
    "quantstats>=0.0.62",
    "mplfinance>=0.12.10b0",
    # Visualization
    "matplotlib>=3.10.0",
    "plotly>=5.18.0",
    "seaborn>=0.13.2",
    "bokeh>=3.8.2",
    # Jupyter & Notebooks
    "jupyter>=1.0.0",
    "jupyterlab>=4.5.5",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.0.0",
    "notebook",
    # Google Cloud
    "google-cloud-aiplatform>=1.139.0",
    "google-cloud-bigquery>=3.40.1",
    "google-cloud-storage>=3.9.0",
    "google-genai>=1.65.0",
    # Utilities
    "loguru>=0.7.3",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "pyyaml>=6.0.3",
    "tqdm>=4.67.3",
    "pydantic>=2.12.5",
    "pykalman>=0.11.2",
    "ploomber>=0.23.3",
    "pyarrow>=7.0.0",
    "pywavelets>=1.8.0",
    "pandas-datareader>=0.10.0",
    "papermill>=2.7.0",
    "nbconvert>=7.17.0",
    "nbformat>=5.10.4",
    "nbclient>=0.10.4",
    "streamlit>=1.56.0",
    "gradio>=6.13.0",
    "hmmlearn>=0.3.3",
    "pyts>=0.13.0",
    "esig>=1.0.0",
    "fredapi>=0.5.2",
    "pymupdf4llm>=1.27.2.3",
    # GPU Acceleration
    "torch>=2.0.0",
    "cupy-cuda12x>=12.0.0; sys_platform == 'linux'",
    "lightgbm>=4.6.0",
    "shap>=0.51.0",
    "duckdb>=1.5.2",
    "pydantic-settings>=2.14.0",
    "mlflow>=3.11.1",
    "prefect>=3.6.28",
    "ruff>=0.15.5",
    "interpret>=0.7.8",
    "autogluon-tabular[all]>=1.5.1b0",
    "scikit-survival>=0.26.0",
    "ruptures>=1.1.10",
    "hdbscan>=0.8.42",
    "pypdf>=6.11.0",
    "pdfplumber>=0.11.9",
    "marker-pdf>=1.6.1",
    "surya-ocr>=0.13.1",
    "graphiti-core[kuzu]>=0.29.0",
    "optuna>=4.8.0",
    "pyportfolioopt>=1.6.0",
    "bandit>=1.9.4",
    "markitdown>=0.1.5",
    "gymnasium>=1.3.0",
    "transformers>=4.57.6",
    "ccxt>=4.5.54",
    "graphifyy>=0.8.5",
    "scrapling>=0.4.8",
    "arch>=8.0.0",
    "stable-baselines3>=2.9.0a2",
    "smartmoneyconcepts>=0.0.27",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pre-commit>=4.6.0",
    "jupytext>=1.19.1",
    "instructor>=1.15.1",
    "hypothesis>=6.152.0",
]

[tool.uv]
# uv-specific settings can go here

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["F841", "F401", "E722"]

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["E402"]
"tests/**/*.py" = ["E402"]
"src/main.py" = ["E402"]
"src/strategies/backtest_py/*.py" = ["E402"]
"src/strategies/ml_strategy.py" = ["E402"]
"src/indicators/pivots.py" = ["E402"]
"src/indicators/technical.py" = ["E402"]
"src/analysis/pattern_selector_viz.py" = ["E402"]
"src/ml/cnn_regime.py" = ["E741"]
"src/ml/triple_barrier.py" = ["E741"]
"src/ml/tuning/woa_tuner.py" = ["E741"]
"src/ml/macro_regime.py" = ["E741"]
"src/gpu/pattern_detector.py" = ["E741"]
"scripts/archive/fix_nb06.py" = ["E741"]
"scripts/archive/fix_notebook_02.py" = ["E402", "F821", "E999"]
"scripts/ml_selector_gradio.py" = ["E402", "F821", "E999"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = false
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = false
warn_no_return = false
warn_unused_ignores = false
show_error_codes = true

[tool.bandit]
exclude_dirs = ["tests", "notebooks", ".venv", "useful_resources", "experiments", "outputs"]
skips = ["B101", "B608", "B301", "B310", "B614", "B615", "B314"]  # pre-existing patterns in data ingestion, ML, RL, sentiment, scraper modules

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
