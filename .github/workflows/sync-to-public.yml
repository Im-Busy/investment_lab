name: Sync to Public Repo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4

      - name: Filter and push to public repo
        env:
          PAT: ${{ secrets.SYNC_PAT }}
        run: |
          set -euo pipefail

          PUBLIC_DIR="/tmp/public_repo"
          WHITELIST="whitelist.txt"
          PUBLIC_REMOTE="https://x-access-token:${PAT}@github.com/Im-Busy/investment_trying_lab.git"

          echo "::group::Preparing public repo directory"
          rm -rf "$PUBLIC_DIR"
          mkdir -p "$PUBLIC_DIR"
          echo "::endgroup::"

          echo "::group::Copying whitelisted files"
          # Normalize line endings and copy each whitelisted path
          COUNT=0
          while IFS= read -r line || [ -n "$line" ]; do
            # Strip CR and trim whitespace
            line=$(echo "$line" | tr -d '\r' | sed 's/[[:space:]]*$//')
            # Skip empty lines and comments
            [[ -z "$line" || "$line" =~ ^# ]] && continue
            if [ -e "$line" ]; then
              mkdir -p "$PUBLIC_DIR/$(dirname "$line")"
              cp -r "$line" "$PUBLIC_DIR/$line"
              COUNT=$((COUNT + 1))
              echo "  Copied: $line"
            else
              echo "  [WARN] Not found: $line"
            fi
          done < "$WHITELIST"
          echo "Copied $COUNT paths"
          echo "::endgroup::"

          echo "::group::Pushing to public repo"
          cd "$PUBLIC_DIR"

          git init
          git checkout -b main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to push"
            exit 0
          fi

          git commit -m "Sync from private repo ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git remote add public "$PUBLIC_REMOTE"
          git push public main --force
          echo "::endgroup::"

          echo "✅ Synced successfully to Im-Busy/investment_trying_lab"
