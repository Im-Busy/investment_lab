  reason_hk: "China regulatory + property crisis broke HK trend patterns. Mean OOS Sharpe -0.46."
  reason_airlines: "High beta + oil price shocks create false pattern breakouts."
  reason_reits: "Rate-sensitive; 2025 rate uncertainty killed trend signals."
