[project]
name = "investment-trying"
version = "0.1.0"
description = "Trading Pattern Detection System"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    # Core Data Science
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.17.0",
    "statsmodels>=0.14.6",
    "numba>=0.59.0",  # JIT compilation for Phase 2 performance optimization
    
    # Machine Learning
    "scikit-learn>=1.8.0",
    "lightgbm>=4.6.0",
    "xgboost>=3.1.3",
    
    # Backtesting & Trading
    "backtesting>=0.6.5",
    "yfinance>=1.2.0",
    "pandas-ta>=0.3.14b",
    "quantstats>=0.0.62",
    "mplfinance>=0.12.10b0",
    
    # Visualization
    "matplotlib>=3.10.0",
    "plotly>=5.18.0",
    "seaborn>=0.13.2",
    "bokeh>=3.8.2",
    
    # Jupyter & Notebooks
    "jupyter>=1.0.0",
    "jupyterlab>=4.5.5",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.0.0",
    "notebook",
    
    # Google Cloud
    "google-cloud-aiplatform>=1.139.0",
    "google-cloud-bigquery>=3.40.1",
    "google-cloud-storage>=3.9.0",
    "google-genai>=1.65.0",
    
    # Utilities
    "loguru>=0.7.3",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "pyyaml>=6.0.3",
    "tqdm>=4.67.3",
    "pydantic>=2.12.5",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.uv]
# uv-specific settings can go here

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
